# nginx server block for materials.karivexsolutionsltd.com
#
# The parent site's origin answered with "Server: nginx" on 2026-10-06, so
# this is the likely integration path. INSPECT the existing nginx setup
# first (nginx -T) and adapt paths/includes to match it. Install as a NEW
# file; do not edit the parent site's server block:
#
#   sudo cp deploy/nginx-materials.conf /etc/nginx/sites-available/materials.karivexsolutionsltd.com
#   sudo ln -s ../sites-available/materials.karivexsolutionsltd.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx        # graceful; rollback = remove the symlink + reload
#
# Certificates: either a Cloudflare Origin CA certificate (when the DNS
# record is Proxied, with SSL mode Full (strict) for this hostname) or a
# Let's Encrypt certificate from certbot (DNS-only). Adjust the two
# ssl_certificate lines accordingly.

upstream karivex_materials_web { server 127.0.0.1:3410; keepalive 16; }
upstream karivex_materials_api { server 127.0.0.1:8410; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name materials.karivexsolutionsltd.com;
    # Keep ACME HTTP-01 working if certbot is used.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name materials.karivexsolutionsltd.com;

    ssl_certificate     /etc/ssl/karivex-materials/origin.pem;
    ssl_certificate_key /etc/ssl/karivex-materials/origin.key;

    client_max_body_size 20m;   # admin uploads (images/PDF datasheets)

    # Overwrite (do not append) forwarding headers so the apps can trust them.
    # If the record is Cloudflare-proxied, also configure set_real_ip_from for
    # Cloudflare's published ranges + real_ip_header CF-Connecting-IP so
    # $remote_addr is the visitor rather than Cloudflare.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Django: admin, its static files, uploaded media, health. The JSON API
    # (/api/v1) is used only server-side by Next.js and is not exposed.
    location /admin/  { proxy_pass http://karivex_materials_api; }
    location /static/ { proxy_pass http://karivex_materials_api; expires 30d; }
    location /media/  { proxy_pass http://karivex_materials_api; expires 7d; }
    location = /healthz { proxy_pass http://karivex_materials_api; }

    # Everything else: Next.js (pages, /api/enquiry, /api/revalidate, assets).
    location / { proxy_pass http://karivex_materials_web; }
}
