name: karivexmaterials-dev

services:
  db:
    image: postgres:16-alpine
    container_name: karivexmaterials-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: karivexmaterials
      POSTGRES_USER: karivexmaterials
      POSTGRES_PASSWORD: karivexmaterials_dev_only
    ports:
      - "5436:5432"
    volumes:
      - karivexmaterials_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karivexmaterials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  karivexmaterials_dev_db_data:
    name: karivexmaterials_dev_db_data
