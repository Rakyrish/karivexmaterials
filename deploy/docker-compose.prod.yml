# KariVex Industrial Materials — production stack.
#
# Dedicated services, credentials and volumes for materials.karivexsolutionsltd.com.
# It does NOT bind ports 80/443: the server's existing reverse proxy (nginx or
# Caddy, see deploy/) forwards the hostname to the loopback ports below.
#
#   cd /opt/karivex-materials            # or wherever the repo is checked out
#   cp .env.example .env.production && edit (real secrets, never commit)
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Change MATERIALS_WEB_PORT / MATERIALS_API_PORT if those loopback ports are
# already used on the server (check with: ss -ltnp).

name: karivex-materials

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karivexmaterials}
      POSTGRES_USER: ${POSTGRES_USER:-karivexmaterials}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - materials_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [materials_internal]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karivexmaterials}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-karivexmaterials}
      MEDIA_ROOT: /app/media
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/revalidate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - materials_media:/app/media
    ports:
      - "127.0.0.1:${MATERIALS_API_PORT:-8410}:8000"
    networks: [materials_internal]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_ORIGIN: ${NEXT_PUBLIC_SITE_ORIGIN:-https://materials.karivexsolutionsltd.com}
        NEXT_PUBLIC_NOINDEX: ${NEXT_PUBLIC_NOINDEX:-false}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MATERIALS_WEB_PORT:-3410}:3000"
    networks: [materials_internal]

volumes:
  materials_db_data:
    name: karivex_materials_db_data
  materials_media:
    name: karivex_materials_media

networks:
  materials_internal:
    name: karivex_materials_internal
